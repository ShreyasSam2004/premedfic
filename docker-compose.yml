# Optional: run against a real PostgreSQL server instead of embedded PGlite.
#   docker compose up -d
#   set DATABASE_URL=postgres://premedfix:premedfix@localhost:5432/premedfix in .env
#   npm run db:seed
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: premedfix
      POSTGRES_PASSWORD: premedfix
      POSTGRES_DB: premedfix
    ports:
      - "5432:5432"
    volumes:
      - premedfix-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premedfix"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  premedfix-pg:
